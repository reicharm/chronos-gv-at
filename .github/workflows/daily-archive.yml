name: CHRONOS daily archive

on:
  schedule:
    - cron: "17 3 * * *"      # taeglich 03:17 UTC (bewusst nicht :00)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Dump datasets (per-file archive)
        run: python dump_data_gv_at_perfile.py
        # env:
        #   DUMP_PROXY: ${{ secrets.DUMP_PROXY }}
        #   REQUESTS_CA_BUNDLE: ${{ secrets.CA_BUNDLE_PATH }}

      - name: Capture facet snapshot (all facets)
        run: python capture_facets.py

      - name: Build dashboard data
        run: python build_dashboard_data.py

      - name: Commit snapshot
        id: commit
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          DATE=$(date -u +%Y-%m-%d)
          git add -A

          if git diff --cached --quiet; then
            STATS="+0 ~0 -0"
            git commit --allow-empty -m "data.gv.at snapshot $DATE (keine Aenderungen)"
          else
            A=$(git diff --cached --name-status -- datasets | grep -c '^A' || true)
            M=$(git diff --cached --name-status -- datasets | grep -c '^M' || true)
            D=$(git diff --cached --name-status -- datasets | grep -c '^D' || true)
            STATS="+$A ~$M -$D"
            git commit -m "data.gv.at snapshot $DATE (datasets $STATS)"
          fi

          echo "date=$DATE"   >> "$GITHUB_OUTPUT"
          echo "stats=$STATS" >> "$GITHUB_OUTPUT"

          # Robust gegen zwischenzeitliche Remote-Aenderungen: rebase & retry
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Push erfolgreich (Versuch $i)."; break
            fi
            if [ "$i" -eq 5 ]; then echo "Push nach 5 Versuchen fehlgeschlagen."; exit 1; fi
            echo "Push abgelehnt - hole Remote-Stand (rebase) und wiederhole (Versuch $i)…"
            git pull --rebase --autostash origin main
            sleep $((RANDOM % 4 + 2))
          done

      - name: Tag snapshot
        run: |
          set -euo pipefail
          DATE="${{ steps.commit.outputs.date }}"
          STATS="${{ steps.commit.outputs.stats }}"
          TAG="snapshot-$DATE"
          git tag -fa "$TAG" -m "data.gv.at datasets $STATS ($DATE)"
          git push -f origin "refs/tags/$TAG"

      - name: Check repo size
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          KB=$(gh api repos/${{ github.repository }} --jq '.size')
          echo "Repo-Groesse (serverseitig, inkl. History): $((KB/1024)) MB"
          if [ "$KB" -gt 4194304 ]; then
            echo "::warning title=CHRONOS Repo-Groesse::Repo ueber 4 GB ($((KB/1024)) MB) - jaehrlichen Rollover planen."
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v4