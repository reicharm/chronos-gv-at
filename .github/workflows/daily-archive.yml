name: CHRONOS daily archive

on:
  schedule:
    # taeglich 03:17 UTC. Bewusst nicht :00 -> geplante Laeufe werden unter Last
    # von GitHub verzoegert/geskippt; ein "krummer" Zeitpunkt reduziert das.
    - cron: "17 3 * * *"
  workflow_dispatch:        # erlaubt manuelles Ausloesen ueber die Actions-UI

permissions:
  contents: write           # noetig fuer Commit, Push und Tag

concurrency:
  group: daily-archive      # nie zwei Laeufe gleichzeitig
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      # 1) Volldump: eine JSON-Datei pro Datensatz (diffbare Historie)
      - name: Dump datasets (per-file archive)
        run: python dump_data_gv_at_perfile.py
        # Fuer interne Instanz / MITM-Proxy Secrets durchreichen:
        # env:
        #   DUMP_PROXY: ${{ secrets.DUMP_PROXY }}
        #   REQUESTS_CA_BUNDLE: ${{ secrets.CA_BUNDLE_PATH }}

      # 2) Facetten-Snapshot: ALLE Facetten (Sicherung fuer spaetere Visualisierungen)
      - name: Capture facet snapshot (all facets)
        run: python capture_facets.py

      # 3) Dashboard-Daten aus dem Facetten-Archiv bauen
      - name: Build dashboard data
        run: python build_dashboard_data.py

      # 4) Alles committen; an aenderungslosen Tagen Empty-Commit als Keepalive
      - name: Commit snapshot
        id: commit
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          DATE=$(date -u +%Y-%m-%d)
          git add -A

          if git diff --cached --quiet; then
            STATS="+0 ~0 -0"
            git commit --allow-empty -m "data.gv.at snapshot $DATE (keine Aenderungen)"
          else
            # Aenderungszahlen nur ueber datasets/ -> aussagekraeftige Message
            A=$(git diff --cached --name-status -- datasets | grep -c '^A' || true)
            M=$(git diff --cached --name-status -- datasets | grep -c '^M' || true)
            D=$(git diff --cached --name-status -- datasets | grep -c '^D' || true)
            STATS="+$A ~$M -$D"
            git commit -m "data.gv.at snapshot $DATE (datasets $STATS)"
          fi

          echo "date=$DATE"   >> "$GITHUB_OUTPUT"
          echo "stats=$STATS" >> "$GITHUB_OUTPUT"
          git push

      # 5) Datums-Tag fuer jeden Tag (auch ohne Aenderung, dank Keepalive-Commit)
      - name: Tag snapshot
        run: |
          set -euo pipefail
          DATE="${{ steps.commit.outputs.date }}"
          STATS="${{ steps.commit.outputs.stats }}"
          TAG="snapshot-$DATE"
          # -f: mehrfacher Lauf am selben Tag verschiebt den Tag auf den neuesten Stand
          git tag -fa "$TAG" -m "data.gv.at datasets $STATS ($DATE)"
          git push -f origin "refs/tags/$TAG"